kind = "web"
previewPath = "/"
title = "Festiva Planner AI"
version = "1.0.0"
id = "artifacts/festiva-planner"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19114

[services.development]
run = "pnpm --filter @workspace/festiva-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/festiva-planner", "run", "build" ]
publicDir = "artifacts/festiva-planner/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19114"
BASE_PATH = "/"
